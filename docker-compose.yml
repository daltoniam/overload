services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: overload
      POSTGRES_USER: overload
      POSTGRES_PASSWORD: overload
    ports:
      - "127.0.0.1:${OVERLOAD_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U overload"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
