apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - rbac.yaml
  - sandbox.yaml
patches:
  - target:
      kind: ServiceAccount
      name: overload
    patch: |-
      - op: replace
        path: /automountServiceAccountToken
        value: true
  - target:
      kind: Deployment
      name: overload
    patch: |-
      - op: replace
        path: /spec/template/spec/automountServiceAccountToken
        value: true
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: OVERLOAD_SANDBOX
          value: agent-sandbox
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: OVERLOAD_SANDBOX_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
