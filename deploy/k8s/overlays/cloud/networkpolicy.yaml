# Overload accepts traffic only from the ingress controller (webhooks) and
# from inside its namespace (port-forward goes through the API server, which
# a NetworkPolicy does not block).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: overload-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: overload
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - port: 8082
