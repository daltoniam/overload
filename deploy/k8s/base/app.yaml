apiVersion: v1
kind: ServiceAccount
metadata:
  name: overload
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: overload
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: overload
  template:
    metadata:
      labels:
        app.kubernetes.io/name: overload
    spec:
      serviceAccountName: overload
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: overload
          image: ghcr.io/daltoniam/overload:latest
          args: ["serve"]
          env:
            - name: OVERLOAD_ADDR
              value: 0.0.0.0:8082
          envFrom:
            - secretRef:
                name: overload
          ports:
            - name: http
              containerPort: 8082
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: overload
spec:
  selector:
    app.kubernetes.io/name: overload
  ports:
    - name: http
      port: 8082
      targetPort: http
