apiVersion: v1
kind: ConfigMap
metadata:
  name: fake-model
  namespace: overload
data:
  server.py: |
    import json, sys
    from http.server import BaseHTTPRequestHandler, HTTPServer

    class Handler(BaseHTTPRequestHandler):
        def do_POST(self):
            body = self.rfile.read(int(self.headers.get("Content-Length", 0))).decode()
            request = json.loads(body)
            text = json.dumps(request.get("messages", []))
            effort = request.get("chat_template_kwargs", {}).get("reasoning_effort", "")
            print(f"REQUEST path={self.path} effort={effort} has_diff={'diff --git' in text} bytes={len(body)}", flush=True)
            content = json.dumps({"summary": "No issues", "findings": []})
            reply = {"id": "1", "object": "chat.completion", "created": 1, "model": "fake",
                     "choices": [{"index": 0, "finish_reason": "stop", "message": {"role": "assistant", "content": content}}]}
            data = json.dumps(reply).encode()
            self.send_response(200)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(data)))
            self.end_headers()
            self.wfile.write(data)

        def log_message(self, *args):
            pass

    HTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fake-model
  namespace: overload
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fake-model
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fake-model
        overload.dev/model: "true"
    spec:
      automountServiceAccountToken: false
      containers:
        - name: model
          image: python:3.13-alpine
          command: ["python", "-u", "/app/server.py"]
          ports:
            - containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: 8080
          volumeMounts:
            - name: app
              mountPath: /app
      volumes:
        - name: app
          configMap:
            name: fake-model
---
apiVersion: v1
kind: Service
metadata:
  name: fake-model
  namespace: overload
spec:
  selector:
    app.kubernetes.io/name: fake-model
  ports:
    - port: 8080
