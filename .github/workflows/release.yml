name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: overload
            dockerfile: deploy/images/app/Dockerfile
          - name: overload-agent
            dockerfile: deploy/images/agent/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          build-args: VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
  binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
  macos-pkg:
    needs: binaries
    runs-on: macos-latest
    env:
      MACOS_SIGN_IDENTITY: ${{ vars.MACOS_SIGN_IDENTITY }}
      MACOS_INSTALLER_IDENTITY: ${{ vars.MACOS_INSTALLER_IDENTITY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - id: credentials
        env:
          MACOS_SIGN_P12_BASE64: ${{ secrets.MACOS_SIGN_P12_BASE64 }}
          MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
        run: |
          if [ -n "$MACOS_SIGN_IDENTITY" ] && [ -n "$MACOS_INSTALLER_IDENTITY" ] && [ -n "$MACOS_SIGN_P12_BASE64" ] && [ -n "$MACOS_NOTARY_APPLE_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Developer ID signing is not configured; the release has no macOS package."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.credentials.outputs.configured == 'true'
        env:
          MACOS_SIGN_P12_BASE64: ${{ secrets.MACOS_SIGN_P12_BASE64 }}
          MACOS_INSTALLER_P12_BASE64: ${{ secrets.MACOS_INSTALLER_P12_BASE64 }}
          MACOS_P12_PASSWORD: ${{ secrets.MACOS_P12_PASSWORD }}
        run: echo "MACOS_KEYCHAIN=$(sh deploy/macos/import-certs.sh)" >> "$GITHUB_ENV"
      - if: steps.credentials.outputs.configured == 'true'
        env:
          MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
          REQUIRE_SIGNED: "1"
        run: make pkg VERSION="$GITHUB_REF_NAME"
      - if: steps.credentials.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/pkg/overload_darwin_universal.pkg dist/pkg/overload_darwin_universal.pkg.sha256 --clobber
      - if: always() && env.MACOS_KEYCHAIN != ''
        run: security delete-keychain "$MACOS_KEYCHAIN"
